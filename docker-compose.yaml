services:
  web:
    build: .
    ports:
      - "80:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "localhost"
    env_file:
      - .env
 
  postgres:
    image: postgres:18
    restart: always
    ports:
    - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql 
 
  adminer:
    image: adminer
    restart: always
    ports:
      - 8100:8080
volumes:
  pgdata: